# Listing classification vocabulary.
#
# All phrases are matched on a normalized title (lowercase, accents stripped,
# punctuation removed, letter/digit boundaries split). Multilingual because
# the target marketplaces are Italy, Germany and Austria.
#
# Keyword rules are signals, not truth. A working GPU with an installed water
# block is not an accessory; see accessory_override_phrases.

defect_terms:
  - "defekt"
  - "defective"
  - "broken"
  - "faulty"
  - "not working"
  - "does not work"
  - "doesnt work"
  - "no display"
  - "no signal"
  - "artifacts"
  - "artefacts"
  - "for parts"
  - "parts only"
  - "spares or repair"
  - "for spares"
  - "bastler"
  - "ersatzteil"
  - "fuer ersatzteile"
  - "nicht funktionsfaehig"
  - "funktioniert nicht"
  - "fehlerhaft"
  - "rotto"
  - "guasto"
  - "non funziona"
  - "non funzionante"
  - "difettoso"
  - "per ricambi"
  - "da riparare"
  - "danneggiato"
  - "danneggiata"
  - "ohne funktion"
  - "dead"
  - "wasser schaden"
  - "wasserschaden"
  - "liquid damage"

# Not proven functional, but not declared broken.
untested_terms:
  - "untested"
  - "not tested"
  - "nicht getestet"
  - "ungetestet"
  - "non testato"
  - "non testata"
  - "as is"
  - "as-is"
  - "wie gesehen"
  - "come da foto"
  - "no returns"
  - "keine ruecknahme"

# These really mean an empty box or a listing without the item.
box_only_terms:
  - "box only"
  - "empty box"
  - "nur ovp"
  - "ovp only"
  - "only the box"
  - "leerer karton"
  - "nur karton"
  - "solo scatola"
  - "scatola vuota"
  - "solo imballo"
  - "no gpu"
  - "gpu not included"
  - "card not included"
  - "karte nicht enthalten"
  - "ohne grafikkarte"
  - "senza scheda"
  - "senza gpu"
  - "nur verpackung"
  - "packaging only"

# Accessory words. Alone they are not enough to disqualify a listing.
accessory_terms:
  - "water block"
  - "waterblock"
  - "wasserkuehler"
  - "wasserkuuhler"
  - "gpu cooler"
  - "cooler only"
  - "heatsink"
  - "kuehlkoerper"
  - "backplate"
  - "luefter"
  - "fan replacement"
  - "replacement fan"
  - "riser"
  - "bracket"
  - "halterung"
  - "supporto"
  - "dissipatore"
  - "cavo"
  - "kabel"
  - "adapter"
  - "vertical mount"

# Explicit accessory-only phrasing: disqualifying on its own.
accessory_only_terms:
  - "water block only"
  - "waterblock only"
  - "nur wasserkuehler"
  - "solo waterblock"
  - "backplate only"
  - "heatsink only"
  - "cooler only"
  - "replacement fan"
  - "ersatzluefter"
  - "fan replacement"
  - "mounting bracket only"
  - "cable only"
  - "only the cooler"

# A working card may legitimately include these. They override a generic
# accessory term, but never an accessory_only phrase.
accessory_override_phrases:
  - "mit wasserkuehler"
  - "with waterblock"
  - "with water block"
  - "watercooled"
  - "water cooled"
  - "custom loop"
  - "aio included"
  - "con waterblock"
  - "con dissipatore"
  - "mit backplate"
  - "with backplate"
  - "inkl kuehler"
  - "complete card"
  - "fully working"
  - "funktioniert einwandfrei"
  - "perfettamente funzionante"

bundle_terms:
  - "bundle"
  - "lot"
  - "job lot"
  - "konvolut"
  - "sammlung"
  - "collection"
  - "combo"
  - "set"
  - "kit"
  - "lotto"
  - "pacco"
  - "mehrere"
  - "multiple"
  - "2x"
  - "3x"
  - "4x"
  - "x2"
  - "x3"
  - "x4"

ambiguous_terms:
  - "read description"
  - "see description"
  - "siehe beschreibung"
  - "vedi descrizione"
  - "siehe bilder"
  - "see photos"
  - "vedi foto"
  - "unknown model"
  - "unbekanntes modell"
  - "modello sconosciuto"
  - "no idea"
  - "keine ahnung"
  - "non so"
  - "wie abgebildet"

# Possibly counterfeit or misleading. Flagged, never silently trusted.
suspicious_terms:
  - "replica"
  - "fake"
  - "faelschung"
  - "falschung"
  - "reproduktion"
  - "clone"
  - "no original"
  - "non originale"
