# Valuation fallback data.
#
# These are ILLUSTRATIVE starting points, not researched sold prices. They are
# marked verified: false, which makes them provisional evidence: the scanner
# will log candidates in shadow mode but will not send normal alerts from them.
#
# To make the scanner trustworthy:
#   1. Replace each price with a value you verified against sold items, a
#      reputable price tracker, or your own completed purchases.
#   2. Set verified: true, sample_size to the number of observations, and
#      observed_at to the date of the evidence.
#   3. Alternatively import real sold observations:
#      docker compose exec ebay-scanner python -m src.main add-comparable \
#        --product rtx_3090 --price 480 --condition used_working \
#        --source "eBay sold items, 2026-10" --verified
#
# Keep separate entries per condition. Never use defective or parts-only
# prices to value a working item.

references:
  - product_id: rtx_4090
    condition_class: used_working
    price_eur: 1250
    sample_size: 0
    verified: false
    source: "PLACEHOLDER - replace with verified sold evidence"
    observed_at: null

