# Search, ranking and scheduling configuration.
#
# This file is configuration, not code: edit it and restart the container.
# The effective polling interval is recalculated from the daily API budget
# at startup, so the values below are targets rather than guarantees.

marketplaces:
  - EBAY_IT
  - EBAY_DE
  - EBAY_AT

delivery:
  country: IT
  postal_code: null

budget:
  # eBay documents a default of 5,000 Browse calls/day. Stay below your real
  # allowance; the ledger refuses calls once this budget is spent.
  daily_calls: 4000
  # Kept for item-detail lookups and manual commands.
  reserve_calls: 800

scan:
  new_listings_minutes: 30
  auctions_minutes: 60
  variant_searches_hours: 6
  bundle_searches_hours: 6
  discovery_hours: 24
  broad_discovery_enabled: true
  # Pagination is deliberately shallow: 50 items/page does not mean the whole
  # result set was examined.
  max_pages: 2
  item_detail_daily_cap: 120
  stale_after_hours: 72
  unknown_after_hours: 336
  taxonomy_cache_days: 30

alerts:
  max_per_day: 40
  material_price_drop_pct: 5
  unknown_shipping_estimate_eur: 15
  # medium or high. Provisional estimates (active listings / unverified
  # references) are never eligible for normal alerts.
  min_confidence: medium
  allow_provisional: false
  auction_alert_hours: 48

ranking:
  full_discount_score_pct: 50
  full_savings_score_eur: 100
  auction_safety_margin_pct: 20
  bundle_haircut_pct: 30
  bundle_min_discount_pct: 35
  bundle_min_savings_eur: 60
  untested_value_haircut_pct: 35
  low_seller_feedback_pct: 95

retention:
  observation_days: 180
  alert_days: 365
  api_call_days: 60
  backup_days: 14

categories:
  gpu:
    label: GPUs
    taxonomy_hint: "Graphics Cards"
    min_discount_pct: 25
    min_savings_eur: 75
    full_savings_score_eur: 300
    default_shipping_eur: 15
  cpu:
    label: CPUs
    taxonomy_hint: "CPUs/Processors"
    min_discount_pct: 25
    min_savings_eur: 30
    full_savings_score_eur: 120
    default_shipping_eur: 8
  ram:
    label: Memory
    taxonomy_hint: "Memory"
    min_discount_pct: 30
    min_savings_eur: 20
    full_savings_score_eur: 80
    default_shipping_eur: 6
  storage:
    label: Storage
    taxonomy_hint: "Hard Drives (HDD, SSD & NAS)"
    min_discount_pct: 30
    min_savings_eur: 15
    full_savings_score_eur: 60
    default_shipping_eur: 6
  motherboard:
    label: Motherboards
    taxonomy_hint: "Motherboards"
    min_discount_pct: 30
    min_savings_eur: 25
    full_savings_score_eur: 90
    default_shipping_eur: 10
  bundle:
    label: Bundles and mixed lots
    taxonomy_hint: "Computers/Tablets & Networking"
    min_discount_pct: 35
    min_savings_eur: 60
    full_savings_score_eur: 250
    default_shipping_eur: 20

# Extra model suffixes that change the product identity. "RTX 3090 Ti" must
# never inherit the RTX 3090 reference price.
variant_suffixes:
