# Bundles take a separate, more conservative valuation path.
bundles:
  - id: gpu_lot
    name: GPU lot
    category: bundle
    priority: normal
    queries:
      - "GPU lot"
      - "Grafikkarten Konvolut"
      - "lotto schede video"
      - "graphics card bundle"
    use_category_filter: true
  - id: workstation_parts
    name: Workstation parts bundle
    category: bundle
    priority: normal
    queries:
      - "workstation bundle"
      - "Workstation Konvolut"
      - "PC parts bundle"
      - "ricambi workstation"
    use_category_filter: true
  - id: ram_lot
    name: RAM lot
    category: bundle
    priority: normal
    queries:
      - "DDR4 RAM lot"
      - "RAM Konvolut"
      - "lotto RAM DDR4"
    use_category_filter: true
  - id: ssd_lot
    name: SSD lot
    category: bundle
    priority: normal
    queries:
      - "SSD lot"
      - "SSD Konvolut"
      - "lotto SSD"
    use_category_filter: true

# Daily broad scans surface model names not yet in the catalogue. They are
# logged for catalogue expansion and only alert when a known product matches.
broad_searches:
  - query: "graphics card"
    category: gpu
    marketplaces: [EBAY_IT, EBAY_DE, EBAY_AT]
    use_category_filter: true
  - query: "Grafikkarte"
    category: gpu
    marketplaces: [EBAY_DE, EBAY_AT]
    use_category_filter: true
  - query: "scheda video"
    category: gpu
    marketplaces: [EBAY_IT]
    use_category_filter: true
  - query: "workstation parts"
    category: bundle
    marketplaces: [EBAY_IT, EBAY_DE]
    use_category_filter: true
