name: ebay-scanner

services:
  ebay-scanner:
    build:
      context: .
      target: runtime
    image: ebay-scanner:local
    container_name: ebay-scanner
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # Persistent SQLite database, WAL files and backups.
      - ./data:/app/data
      # Read-only search catalogue and valuation references.
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image runs as 10001:10001. Override to match the owner of ./data on
    # Linux, or chown ./data to 10001:10001 first.
    user: "${SCANNER_UID:-10001}:${SCANNER_GID:-10001}"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Local web dashboard over the same SQLite database. Shares the ./data
  # volume with the scanner: SQLite WAL mode allows one writer (the scanner)
  # and many readers (the dashboard) concurrently. Bound to loopback by
  # default; set GUI_BIND=0.0.0.0 on the homelab to reach it from your LAN.
  gui:
    build:
      context: .
      target: runtime
    image: ebay-scanner:local
    container_name: ebay-scanner-gui
    restart: unless-stopped
    init: true
    env_file:
      - .env
    command: ["gui", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${GUI_BIND:-127.0.0.1}:${GUI_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${SCANNER_UID:-10001}:${SCANNER_GID:-10001}"
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
